[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hector-desktop"
version = "1.0.0"
description = "HECTOR Desktop — Single-Cell Prediction & UMAP visualization."
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
dependencies = [
  "hector-sc>=1.0.2",
  "PySide6>=6.6",
  "matplotlib>=3.7",
  "pyqtgraph>=0.13",
  "mlx>=0.20; sys_platform == 'darwin'",
  "pynndescent>=0.5",
]

[project.scripts]
hector-desktop = "hector_desktop.__main__:main"

[tool.setuptools.packages.find]
include = ["hector_desktop", "hector_desktop.*"]
